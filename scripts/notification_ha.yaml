alias: Notification HA
description: >-
  Statut : Finalise

  Evolution : Aucune


  Role : Envoie une notification persistante Home Assistant.


  Parametres :

  - message_type : type du message

  - message_ha : contenu du message

  - notification_id (optionnel) : identifiant permettant de mettre a jour ou de
  dismiss la notification ensuite (persistent_notification.dismiss)


  Fonctionnement :

  1. Envoie une notification persistante via notify.persistent_notification avec
  le type en titre et le message en corps.

  2. Si notification_id est fourni, il est transmis pour permettre la mise a
  jour ou la suppression ciblee de la notification.
sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ notification_id is defined and notification_id not in [None,
              ''] }}
        sequence:
          - action: notify.persistent_notification
            data:
              title: "[HA] {{ message_type }}"
              message: "{{ message_ha }}"
              data:
                notification_id: "{{ notification_id }}"
    default:
      - action: notify.persistent_notification
        data:
          title: "[HA] {{ message_type }}"
          message: "{{ message_ha }}"
mode: queued
max: 10
