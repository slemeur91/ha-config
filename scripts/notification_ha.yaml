alias: Notification HA
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Rôle :** Envoie une notification persistante Home Assistant.

  **Paramètres :**
  - message_type : type du message
  - message_corp : contenu du message
  - message_id (optionnel) : identifiant permettant de mettre à jour ou de dismiss la notification ensuite (persistent_notification.dismiss). Si non fourni, calculé automatiquement à partir de message_type et message_corp (hash) pour éviter les doublons.

  **Fonctionnement :**
  1. Envoie une notification persistante via notify.persistent_notification avec le type en titre et le message en corps.
  2. L'identifiant (fourni ou calculé automatiquement si absent) est transmis pour permettre la mise à jour ou la suppression ciblée de la notification.

  **Entités principales :**
  - notify.persistent_notification : service de notification utilisé
fields:
  message_type:
    description: Type du message (Information, Alerte, Chauffage, etc.)
    example: Information
    required: true
    selector:
      text: null
  message_corp:
    description: Corps du message
    example: Message
    required: true
    selector:
      text: null
  message_id:
    description: Identifiant permettant de mettre à jour ou de dismiss la notification. Si non fourni, calculé automatiquement à partir de message_type et message_corp (hash) pour éviter les doublons.
    example: identifiant
    required: false
    selector:
      text: null
sequence:
  - variables:
      message_id_final: "{{ message_id if (message_id is defined and message_id not in [None, '']) else (message_type ~ message_corp) | md5 }}"
  - action: notify.persistent_notification
    data:
      title: "[HA] {{ message_type }}"
      message: "{{ message_corp }}"
      data:
        notification_id: "{{ message_id_final }}"
mode: queued
max: 10
