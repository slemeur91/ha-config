alias: Notification HA
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Rôle :** Envoie une notification persistante Home Assistant.

  **Paramètres :**
  - message_type : type du message
  - message_ha : contenu du message
  - notification_id (optionnel) : identifiant permettant de mettre à jour ou de dismiss la notification ensuite (persistent_notification.dismiss)

  **Fonctionnement :**
  1. Envoie une notification persistante via notify.persistent_notification avec le type en titre et le message en corps.
  2. Si notification_id est fourni, il est transmis pour permettre la mise à jour ou la suppression ciblée de la notification.

  **Entités principales :**
  - notify.persistent_notification : service de notification utilisé
fields:
  message_type:
    description: Type du message (Information, Alerte, Chauffage, etc.)
    example: Information
    required: true
    selector:
      text: null
  message_ha:
    description: Corps du message
    example: Message
    required: true
    selector:
      text: null
  notification_id:
    description: identifiant permettant de mettre a jour ou de dismiss la notification
    example: identifiant
    required: true
    selector:
      text: null
sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ notification_id is defined and notification_id not in [None, ''] }}"
        sequence:
          - action: notify.persistent_notification
            data:
              title: "[HA] {{ message_type }}"
              message: "{{ message_ha }}"
              data:
                notification_id: "{{ notification_id }}"
    default:
      - action: notify.persistent_notification
        data:
          title: "[HA] {{ message_type }}"
          message: "{{ message_ha }}"
mode: queued
max: 10
