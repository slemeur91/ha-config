alias: Allumer/Éteindre Apple TV du Salon
description: >-
  **Statut :** Finalisé

  **Evolution :** Aucune


  **Déclencheurs :**

  - Appelé par "Gestion de la HiFi" (branche extinction, `action: "off"`, et
  branche allumage/SOURCE, `action: "on"`), via `script.turn_on`
  (fire-and-forget)


  **Fonctionnement :**

  1. `action: "off"` → envoie la commande `suspend` (seule méthode fiable testée
  pour éteindre cet appareil).

  2. `action: "on"` → recharge l'intégration
  (`homeassistant.reload_config_entry` sur `remote.apple_tv_du_salon`), attend 8
  s, puis appelle `media_player.turn_on` (branche de repli désactivée par défaut
  qui réessaie 6 fois avec 5 s entre chaque tentative).

  3. Erreur ignorée (`continue_on_error`) : ce script est lancé en tâche de fond
  via `script.turn_on` afin qu'un échec ponctuel (ex: "Command _hidC failed")
  n'interrompe jamais l'automatisation appelante.


  **Entités principales :**

  - `media_player.apple_tv_du_salon` : état vérifié

  - `remote.apple_tv_du_salon` : cible de la commande `suspend`
mode: queued
max: 5
sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ action == \"off\" }}"
        sequence:
          - action: remote.send_command
            target:
              entity_id: remote.apple_tv_du_salon
            data:
              command: suspend
            continue_on_error: true
            enabled: true
      - conditions:
          - condition: template
            value_template: "{{ action == \"on\" }}"
        sequence:
          - action: media_player.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: media_player.apple_tv_du_salon
            enabled: false
            continue_on_error: true
          - action: remote.send_command
            target:
              entity_id: remote.apple_tv_du_salon
            data:
              command: wakeup
            enabled: false
          - sequence:
              - action: homeassistant.reload_config_entry
                metadata: {}
                data: {}
                target:
                  entity_id: remote.apple_tv_du_salon
              - delay:
                  hours: 0
                  minutes: 0
                  seconds: 8
                  milliseconds: 0
              - action: homeassistant.update_entity
                metadata: {}
                data:
                  entity_id:
                    - media_player.apple_tv_du_salon
                enabled: false
              - action: media_player.turn_on
                continue_on_error: true
                metadata: {}
                data: {}
                target:
                  entity_id: media_player.apple_tv_du_salon
            continue_on_error: true
            enabled: true
          - sequence:
              - action: homeassistant.reload_config_entry
                target:
                  entity_id: remote.apple_tv_du_salon
              - delay:
                  seconds: 8
              - repeat:
                  count: 6
                  sequence:
                    - action: media_player.turn_on
                      continue_on_error: true
                      target:
                        entity_id: media_player.apple_tv_du_salon
                    - delay:
                        seconds: 5
                    - if:
                        - condition: template
                          value_template: >
                            {{ not is_state('media_player.apple_tv_du_salon',
                            'standby')
                               and not is_state('media_player.apple_tv_du_salon', 'unavailable') }}
                      then:
                        - stop: Apple TV réveillée
            enabled: false
            continue_on_error: true
  - if:
      - condition: and
        conditions:
          - condition: not
            conditions:
              - condition: state
                entity_id: media_player.apple_tv_du_salon
                state:
                  - "off"
                  - standby
                  - unavailable
            enabled: true
          - condition: media_player.is_on
            target:
              device_id: 9d5e183d3174508e18e6e7345ed66e1d
            options:
              behavior: any
            enabled: true
          - condition: remote.is_on
            target:
              entity_id: remote.apple_tv_du_salon
            options:
              behavior: any
              for: "00:00:00"
    then:
      - action: remote.send_command
        target:
          entity_id: remote.apple_tv_du_salon
        data:
          command: suspend
        continue_on_error: true
    enabled: false
