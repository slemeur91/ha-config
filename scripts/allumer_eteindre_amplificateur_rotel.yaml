alias: Allumer/Éteindre Amplificateur ROTEL
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Rôle :** Allume ou éteint l'amplificateur ROTEL et sélectionne son entrée vidéo, en pilotant les boutons de l'ampli et en vérifiant l'état atteint via sa présence réseau (device_tracker ou ping). Appelé par 'Gestion de la HiFi' (branche extinction avec action: 'off', branche SOURCE avec action: 'on') via script.turn_on (fire-and-forget).

  **Paramètres :**
  - action : 'on' ou 'off'

  **Fonctionnement :**
  1. action 'off' → répète le cycle suivant jusqu'à ce que l'ampli ne soit plus détecté sur le réseau (device_tracker.slm_rotel_slm_rotel à 'not_home' OU binary_sensor.192_168_51_55 à 'off') : 3 appuis sur button.rotel_off espacés de 3s, attente de 20s, rafraîchissement forcé du ping (homeassistant.update_entity), attente de 10s.
  2. action 'on' → même cycle, avec 3 appuis sur l'entrée vidéo correspondant à input_select.hifi_source ('Zappiti' → button.rotel_video1, 'BluRay' → button.rotel_video2, 'slm-media4' → button.rotel_video3), jusqu'à ce que l'ampli soit détecté (device_tracker à 'home' OU ping à 'on').
  3. continue_on_error : une erreur sur une étape n'interrompt pas le script.

  **Limite :** chaque boucle s'arrête au plus tard après 5 cycles (environ 3 min 30). Si l'état réseau attendu n'est toujours pas atteint, une entrée est écrite dans le journal (logbook) au nom de l'ampli, au lieu de boucler indéfiniment.

  **Entités principales :**
  - button.rotel_off, button.rotel_video1/2/3 : commandes de l'ampli (extinction / sélection d'entrée)
  - device_tracker.slm_rotel_slm_rotel, binary_sensor.192_168_51_55 (ping) : présence réseau de l'ampli, utilisée pour vérifier l'état atteint
  - input_select.hifi_source : source sélectionnée, détermine l'entrée vidéo activée
sequence:
  - choose:
      - conditions:
          - condition: template
            value_template: '{{ action == "off" }}'
        sequence:
          - repeat:
              sequence:
                - repeat:
                    count: 3
                    sequence:
                      - action: button.press
                        data: {}
                        metadata: {}
                        target:
                          entity_id: button.rotel_off
                      - delay:
                          hours: 0
                          minutes: 0
                          seconds: 3
                          milliseconds: 0
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 20
                    milliseconds: 0
                - action: homeassistant.update_entity
                  metadata: {}
                  data:
                    entity_id:
                      - binary_sensor.192_168_51_55
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 10
                    milliseconds: 0
              until:
                - condition: or
                  conditions:
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: device_tracker.slm_rotel_slm_rotel
                          state:
                            - not_home
                        - condition: state
                          entity_id: binary_sensor.192_168_51_55
                          state:
                            - 'off'
                    - condition: template
                      value_template: '{{ repeat.index >= 5 }}'
          - if:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: device_tracker.slm_rotel_slm_rotel
                        state:
                          - not_home
                      - condition: state
                        entity_id: binary_sensor.192_168_51_55
                        state:
                          - 'off'
            then:
              - action: logbook.log
                data:
                  name: Amplificateur ROTEL
                  entity_id: device_tracker.slm_rotel_slm_rotel
                  message: 'Échec probable de la commande ''off'' : l''état réseau attendu n''a pas été observé après 5 cycles.'
            note: État réseau attendu non atteint après 5 cycles → trace dans le journal
        note: Extinction → 3 appuis sur OFF puis vérification réseau, répété jusqu'à ce que l'ampli ne réponde plus (5 cycles maximum)
      - conditions:
          - condition: template
            value_template: '{{ action == "on" }}'
        sequence:
          - repeat:
              sequence:
                - repeat:
                    count: 3
                    sequence:
                      - choose:
                          - conditions:
                              - condition: state
                                entity_id: input_select.hifi_source
                                state: Zappiti
                            sequence:
                              - action: button.press
                                data: {}
                                metadata: {}
                                target:
                                  entity_id: button.rotel_video1
                          - conditions:
                              - condition: state
                                entity_id: input_select.hifi_source
                                state: BluRay
                            sequence:
                              - action: button.press
                                data: {}
                                metadata: {}
                                target:
                                  entity_id: button.rotel_video2
                          - conditions:
                              - condition: state
                                entity_id: input_select.hifi_source
                                state: slm-media4
                            sequence:
                              - action: button.press
                                data: {}
                                metadata: {}
                                target:
                                  entity_id: button.rotel_video3
                      - delay:
                          hours: 0
                          minutes: 0
                          seconds: 3
                          milliseconds: 0
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 20
                    milliseconds: 0
                - action: homeassistant.update_entity
                  metadata: {}
                  data:
                    entity_id:
                      - binary_sensor.192_168_51_55
                - delay:
                    hours: 0
                    minutes: 0
                    seconds: 10
                    milliseconds: 0
              until:
                - condition: or
                  conditions:
                    - condition: or
                      conditions:
                        - condition: state
                          entity_id: device_tracker.slm_rotel_slm_rotel
                          state:
                            - home
                        - condition: state
                          entity_id: binary_sensor.192_168_51_55
                          state:
                            - 'on'
                    - condition: template
                      value_template: '{{ repeat.index >= 5 }}'
          - if:
              - condition: not
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: device_tracker.slm_rotel_slm_rotel
                        state:
                          - home
                      - condition: state
                        entity_id: binary_sensor.192_168_51_55
                        state:
                          - 'on'
            then:
              - action: logbook.log
                data:
                  name: Amplificateur ROTEL
                  entity_id: device_tracker.slm_rotel_slm_rotel
                  message: 'Échec probable de la commande ''on'' : l''état réseau attendu n''a pas été observé après 5 cycles.'
            note: État réseau attendu non atteint après 5 cycles → trace dans le journal
        note: Allumage → 3 appuis sur l'entrée vidéo de la source puis vérification réseau, répété jusqu'à ce que l'ampli réponde (5 cycles maximum)
    continue_on_error: true
mode: queued
max: 5
