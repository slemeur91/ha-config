alias: Notification Mail
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Rôle :** Envoie un mail de notification.

  **Paramètres :**
  - message_type : type du message (Information, Alerte, Chauffage, etc.)
  - message_corp : corps du message

  **Fonctionnement :**
  1. Envoie un mail via l'action smtp.send_message sur notify.email_slemeur_slm_srv_dscloud_me, avec '[HA] ' suivi du type en objet et le message en corps.

  **Entités principales :**
  - notify.email_slemeur_slm_srv_dscloud_me : entité de notification SMTP utilisée (action smtp.send_message)
fields:
  message_type:
    description: Type du message (Information, Alerte, Chauffage, etc.)
    example: Information
    required: true
    selector:
      text: null
  message_corp:
    description: Corps du message
    example: Message
    required: true
    selector:
      text: null
sequence:
  - action: smtp.send_message
    metadata: {}
    target:
      entity_id: notify.email_slemeur_slm_srv_dscloud_me
    data:
      title: '[HA] {{ message_type }}'
      message: '{{ message_corp }}'
mode: queued
max: 10
