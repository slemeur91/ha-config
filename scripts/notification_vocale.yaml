alias: Notification Vocale
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Rôle :** Diffuse un message TTS en overlay (announce) via Music Assistant sur le groupe `media_player.enceintes`, sans interrompre la lecture.

  **Paramètres :**
  - message_corp : texte à synthétiser

  **Fonctionnement :**
  - Cible principale : `media_player.enceintes`, dont les membres sont gérés par l'automatisation « Gestion des enceintes » (Salon seul au repos).
  - Volume d'annonce : 40 en mode COUCHE (`input_select.sonos`), 60 sinon.
  - En parallèle, si le Garage (`media_player.garage`, Sonos natif hors Music Assistant) est en lecture, il reçoit la même annonce, volume 40. Il n'est pas synchronisé avec le groupe.

  Music Assistant joue l'annonce de façon synchronisée sur les enceintes du groupe, puis restaure le volume et la lecture.

  **Entités principales :**
  - media_player.enceintes
  - media_player.garage : Sonos natif (réseau Wi-Fi séparé)
  - input_select.sonos : mode en cours (volume réduit en COUCHE)
fields:
  message_corp:
    description: Corps du message
    example: Message
    required: true
    selector:
      text: null
sequence:
  - parallel:
      - action: media_player.play_media
        target:
          entity_id: media_player.enceintes
        data:
          announce: true
          extra:
            announce_volume: '{{ 40 if is_state(''input_select.sonos'', ''COUCHE'') else 60 }}'
            use_pre_announce: false
          media:
            media_content_id: media-source://tts/tts.google_translate_en_com?message={{ message_corp | urlencode }}&language=fr&cache=true
            media_content_type: music
            metadata: {}
        note: Annonce sur le groupe Enceintes ; volume 40 en mode COUCHE, sinon 60
      - if:
          - condition: state
            entity_id: media_player.garage
            state: playing
        then:
          - action: media_player.play_media
            target:
              entity_id: media_player.garage
            data:
              announce: true
              extra:
                volume: 40
              media:
                media_content_id: media-source://tts/tts.google_translate_en_com?message={{ message_corp | urlencode }}&language=fr&cache=true
                media_content_type: music
                metadata: {}
        note: Garage en lecture → même annonce en Sonos natif (hors Music Assistant), volume d'annonce 40 comme dans l'ancien script
    note: Annonce sur le groupe Enceintes et, en parallèle, sur le Garage s'il joue
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 50
mode: queued
max: 10
