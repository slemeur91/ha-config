alias: Notification Snapshot du Portier
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Rôle :** Capture un snapshot du portier et l'envoie par mail avec le message et le type fournis en paramètres. Appelé par 'Notification du Portier' via script.turn_on.

  **Paramètres :**
  - message_type : type du message (ex : 'Portier')
  - message_corp : corps du message (ex : 'Appuis sur la sonnette')

  **Fonctionnement :**
  1. Capture une image du flux haute résolution du portier (camera.exterieur_slm_portier_high_resolution_channel) dans /media/Snapshots/portier.jpg.
  2. Envoie un mail '[HA] ' suivi du type, avec l'image en pièce jointe et le message en corps (via smtp.send_message).

  **Entités principales :**
  - camera.exterieur_slm_portier_high_resolution_channel : flux capturé
  - notify.email_slemeur_slm_srv_dscloud_me (smtp.send_message) : envoi du mail
fields:
  message_type:
    description: 'Type du message (ex : "Portier")'
    example: Portier
    required: true
    selector:
      text: null
  message_corp:
    description: 'Corps du message (ex : "Appuis sur la sonnette")'
    example: Appuis sur la sonnette
    required: true
    selector:
      text: null
sequence:
  - action: camera.snapshot
    target:
      entity_id:
        - camera.exterieur_slm_portier_high_resolution_channel
    data:
      filename: /media/Snapshots/portier.jpg
    note: Capture du flux haute résolution du portier dans /media/Snapshots/portier.jpg
  - note: Envoie de la capture du portier en pièce jointe par mail [HA]
    action: smtp.send_message
    metadata: {}
    target:
      entity_id: notify.email_slemeur_slm_srv_dscloud_me
    data:
      title: '[HA] {{ message_type }}'
      message: '{{ message_corp }}'
      attachments:
        - media_source:
            media_content_id: media-source://media_source/local/Snapshots/portier.jpg
            media_content_type: image/jpeg
            metadata:
              title: portier.jpg
              thumbnail: null
              media_class: image
              children_media_class: null
              navigateIds:
                - {}
                - media_content_type: app
                  media_content_id: media-source://media_source
                - media_content_type: ''
                  media_content_id: media-source://media_source/local/Snapshots
mode: queued
max: 10
