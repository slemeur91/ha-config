alias: Surveillance - Recharger les intégrations en défaut
description: >-
  **Statut :** Finalise

  **Evolution :** Aucune


  **Declencheurs :**

  - 12 minutes apres le demarrage de Home Assistant

  - Detection d'un nouveau probleme dans Repairs (`event.repair`, event_type =
  create)

  - Verification periodique toutes les 15 minutes


  **Fonctionnement :**

  1. Recherche les entrees de configuration via les entites existantes
  (`config_entry_id`).

  2. Detecte deux types de panne :
     - Erreur officielle : etat setup_error, setup_retry, failed_unload ou migration_error.
     - Panne silencieuse : integration declaree 'loaded' mais dont 100% des entites sont 'unavailable' depuis plus de 10 minutes (ex : Netatmo dont toutes les sondes tombent indisponibles sans que l'integration ne passe en erreur). Les integrations media/TV (dlna_dmr, cast, braviatv, apple_tv, androidtv, samsungtv, roku, webostv, kodi, lg_netcast, philips_js, firetv) sont exclues car elles s'eteignent normalement.
  3. Recharge chaque entree en erreur ou en panne silencieuse via
  `homeassistant.reload_config_entry`.

  4. Envoie une notification HA (script.notification) pour chaque panne
  silencieuse detectee, avec un notification_id stable par integration (pas de
  doublon si le probleme persiste).


  **Entites principales :**

  - `event.repair` : declencheur sur detection d'un probleme Repairs

  - Liste des integrations en erreur/panne calculee dynamiquement (aucune entite
  fixe ciblee)

  - `script.notification` (Notification HA) : notification des pannes
  silencieuses
triggers:
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: event.repair
    attribute: event_type
    to: create
    id: issue_created
  - trigger: time_pattern
    minutes: /15
    id: periodic_check
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: startup
        sequence:
          - delay:
              minutes: 12
    note: >-
      Si déclenché par le démarrage de HA : patiente 12 minutes avant de
      vérifier les intégrations (laisse le temps au réseau/aux services de
      redémarrer ET dépasse le seuil de 10 min de panne silencieuse, sinon une
      intégration qui plante systématiquement au boot — ex : LocalTuya — n'est
      jamais détectée par ce déclencheur et attend le prochain passage
      périodique, jusqu'à 15 min plus tard)
  - variables:
      error_entries: |-
        {% set ns = namespace(rows=[]) %}
        {% for s in states %}
          {% set eid = config_entry_id(s.entity_id) %}
          {% if eid is not none %}
            {% set ns.rows = ns.rows + [eid] %}
          {% endif %}
        {% endfor %}
        {% set ns2 = namespace(items=[]) %}
        {% for eid in ns.rows | unique | list %}
          {% if config_entry_attr(eid, 'state') in ['setup_error','setup_retry','failed_unload','migration_error'] %}
            {% set ns2.items = ns2.items + [eid] %}
          {% endif %}
        {% endfor %}
        {{ ns2.items }}
      silent_entries: >-
        {% set exclusions_domains = ['dlna_dmr', 'cast', 'braviatv', 'apple_tv',
        'androidtv', 'samsungtv', 'roku', 'webostv', 'kodi', 'lg_netcast',
        'philips_js', 'firetv'] %}

        {% set ns = namespace(rows=[]) %}

        {% for s in states %}
          {% set eid = config_entry_id(s.entity_id) %}
          {% if eid is not none %}
            {% set ns.rows = ns.rows + [{'entry_id': eid, 'state': s.state, 'last_changed': s.last_changed}] %}
          {% endif %}
        {% endfor %}

        {% set grouped = ns.rows | groupby('entry_id') %}

        {% set ns2 = namespace(items=[]) %}

        {% for entry_id, items in grouped %}
          {% if config_entry_attr(entry_id, 'state') == 'loaded' and config_entry_attr(entry_id, 'domain') not in exclusions_domains %}
            {% set unavailable_count = items | selectattr('state', 'eq', 'unavailable') | list | length %}
            {% if items | length > 0 and unavailable_count == items | length %}
              {% set most_recent = items | map(attribute='last_changed') | list | max %}
              {% if (now() - most_recent).total_seconds() > 600 %}
                {% set ns2.items = ns2.items + [entry_id] %}
              {% endif %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {{ ns2.items }}
      failed_entries: "{{ (error_entries + silent_entries) | unique | list }}"
    note: >-
      Calcule la liste des integrations en erreur officielle
      (setup_error/setup_retry/failed_unload/migration_error) ET celles en panne
      silencieuse (loaded mais 100% des entites indisponibles depuis plus de 10
      min), hors integrations media/TV qui s'eteignent normalement
  - repeat:
      for_each: "{{ failed_entries }}"
      sequence:
        - action: homeassistant.reload_config_entry
          data:
            entry_id: "{{ repeat.item }}"
          continue_on_error: true
    note: Recharge chaque integration en erreur ou en panne silencieuse, une par une
  - note: >-
      Notifie (Notification HA) chaque integration detectee en panne
      silencieuse, hors integrations media/TV
    repeat:
      for_each: "{{ silent_entries }}"
      sequence:
        - action: script.turn_on
          target:
            entity_id:
              - script.notification_ha
          data:
            variables:
              message_type: >-
                Integration en panne silencieuse — {{
                config_entry_attr(repeat.item, 'title') }}
              message_ha: >-
                L'integration {{ config_entry_attr(repeat.item, 'domain') }} ({{
                config_entry_attr(repeat.item, 'title') }}) a toutes ses entites
                indisponibles depuis plus de 10 minutes alors qu'elle est
                declaree chargee. Un rechargement automatique a ete tente.
              notification_id: integration_silent_failure-{{ repeat.item }}
mode: queued
max: 10
