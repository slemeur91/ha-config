alias: Correction de l'Onduleur
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune.

  **Déclencheurs :**
  - Démarrage de Home Assistant (`homeassistant start`) — id: Démarrage
  - `sensor.eaton_usb_etat` reste `unavailable`/`unknown` pendant 2 minutes
  - `sensor.eaton_usb_code_d_etat` reste `unavailable`/`unknown` pendant 2 minutes

  **Fonctionnement :**
  1. Si le déclencheur est le démarrage de HA, attend 4 minutes (le temps que l'intégration NUT tente de se reconnecter à l'onduleur).
  2. Vérifie l'état de l'onduleur Eaton_Usb (`sensor.eaton_usb_etat` et `sensor.eaton_usb_code_d_etat`).
  3. Si l'un des deux est `unavailable`/`unknown` (intégration NUT en défaut), redémarre l'app 'Network UPS Tools' (`a0d7b954_nut`).
  4. Sinon, ne fait rien.

  **Entités principales :**
  - `sensor.eaton_usb_etat` : état de l'onduleur Eaton_Usb
  - `sensor.eaton_usb_code_d_etat` : code d'état NUT de l'onduleur Eaton_Usb
  - App `Network UPS Tools` (`a0d7b954_nut`) : redémarrée en cas de défaut
triggers:
  - trigger: homeassistant
    event: start
    id: Démarrage
  - trigger: state
    entity_id:
      - sensor.eaton_usb_etat
    to:
      - unavailable
      - unknown
    for:
      hours: 0
      minutes: 2
      seconds: 0
  - trigger: state
    entity_id:
      - sensor.eaton_usb_code_d_etat
    to:
      - unavailable
      - unknown
    for:
      hours: 0
      minutes: 2
      seconds: 0
conditions: []
actions:
  - if:
      - condition: trigger
        id:
          - Démarrage
    then:
      - delay:
          hours: 0
          minutes: 4
          seconds: 0
        note: Laisse le temps aux add-ons et intégrations de se stabiliser après le démarrage
  - if:
      - condition: or
        conditions:
          - condition: state
            entity_id: sensor.eaton_usb_etat
            state:
              - unavailable
              - unknown
          - condition: state
            entity_id: sensor.eaton_usb_code_d_etat
            state:
              - unavailable
              - unknown
    then:
      - action: hassio.addon_restart
        data:
          addon: a0d7b954_nut
    else: []
    note: Onduleur toujours indisponible → redémarre l'app Network UPS Tools
mode: single
