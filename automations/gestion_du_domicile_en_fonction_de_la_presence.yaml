alias: Gestion du Domicile en fonction de la Présence
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Déclencheurs :**
  - Changement de `input_select.presence_action` (Présent / Réveil / Arrivée / Extinction / Couché)

  **Fonctionnement :**
  1. Présent → lance les SONOS en mode ON (sauf s'ils sont en REVEIL), arrête la climatisation (`input_button.climatisation_stop`), éteint la prise de l'entrée, allume les prises habituelles (hotte, four, alimentation Apple, terrasse).
  2. Réveil → déverrouille la serrure du garage, allume escalier/palier/cuisine/séjour s'il fait encore sombre (jusqu'à 30 min après le lever du soleil), allume les prises habituelles + purificateur + ventilateur + machine à café, éteint la prise de l'entrée, arrête la climatisation.
  3. Arrivée → déverrouille la serrure du garage, allume l'entrée si période sombre, allume les prises purificateur + ventilateur, puis bascule en mode Présent.
  4. Extinction / Couché → éteint la HiFi, verrouille les deux serrures, éteint les lumières et prises non essentielles (garage, bureau, Apple, terrasse, hotte, four, TV suite parentale) ; les lumières des pièces de vie ne sont éteintes que si l'alarme est armée (absent) ou si la pièce est notée Absent.
     - Alarme armée (absent) : éteint en plus les lumières de circulation et des salles d'eau, ouvre le store pergola s'il n'est pas complètement ouvert, coupe les prises purificateur/ventilateur si aucune purification n'est en cours.
     - Couché : allume les veilleuses (entrée, escalier, palier, suite parentale) avant 02:00 ou après le coucher du soleil, allume la prise de l'entrée, lance les SONOS en mode COUCHE puis remonte le volume suite parentale + salle d'eau après 10 s.

  **Entités principales :**
  - `input_select.presence_action` : commande entrante (alimentée par `Gestion de l'Alarme`)
  - `lock.serrure_de_l_entree` / `lock.serrure_du_garage` : verrouillage automatique
  - `input_select.sonos_action` / `input_select.hifi_action` : coordination AV
  - `input_button.climatisation_stop` : arrêt de la climatisation
  - `cover.store_pergola` : ouverture automatique en cas d'absence
  - `switch.machine_a_cafe_100_automatique` : démarrage café au réveil
triggers:
  - entity_id:
      - input_select.presence_action
    trigger: state
conditions: []
actions:
  - choose:
      - conditions:
          - condition: state
            entity_id: input_select.presence_action
            state: Présent
        sequence:
          - if:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: input_select.sonos
                    state: REVEIL
            then:
              - if:
                  - condition: state
                    entity_id: input_select.sonos_action
                    state: 'ON'
                then:
                  - action: automation.trigger
                    metadata: {}
                    data:
                      skip_condition: true
                    target:
                      entity_id:
                        - automation.gestion_des_sonos
                else:
                  - action: input_select.select_option
                    metadata: {}
                    data:
                      option: 'ON'
                    target:
                      entity_id: input_select.sonos_action
          - action: input_button.press
            metadata: {}
            target:
              entity_id:
                - input_button.climatisation_stop
            data: {}
          - action: switch.turn_off
            continue_on_error: true
            data: {}
            target:
              entity_id: switch.prise_de_l_entree
          - action: switch.turn_on
            continue_on_error: true
            data: {}
            target:
              entity_id:
                - switch.prise_de_la_hotte
                - switch.contacteur_du_four
          - action: switch.turn_on
            continue_on_error: true
            data: {}
            target:
              entity_id:
                - switch.multiprise_du_salon_droite_1_alimentation_apple
                - switch.terrasse_prise_de_la_terrasse_socket_1
        note: Mode Présent → lance SONOS ON (sauf si REVEIL), arrête la climatisation, éteint la prise de l'entrée, allume prises habituelles (hotte, four, terrasse, Apple)
      - conditions:
          - condition: state
            entity_id: input_select.presence_action
            state: Réveil
        sequence:
          - if:
              - condition: state
                entity_id: lock.serrure_du_garage
                state: locked
            then:
              - action: lock.unlock
                data: {}
                target:
                  entity_id: lock.serrure_du_garage
                continue_on_error: true
          - if:
              - condition: sun
                before: sunrise
                before_offset: '1800'
            then:
              - action: light.turn_on
                data: {}
                target:
                  entity_id:
                    - light.lumiere_de_lescalier
                    - light.lumiere_du_palier
                    - light.lumiere_de_la_cuisine
                    - light.lumiere_du_sejour
          - action: switch.turn_on
            continue_on_error: true
            data: {}
            target:
              entity_id:
                - switch.multiprise_du_salon_droite_1_alimentation_apple
                - switch.terrasse_prise_de_la_terrasse_socket_1
                - switch.prise_de_la_hotte
                - switch.contacteur_du_four
          - action: switch.turn_on
            target:
              entity_id:
                - switch.multiprise_du_salon_droite_2_purificateur
                - switch.salon_multiprise_du_salon_gauche_2_ventilateur
            data: {}
          - action: switch.turn_off
            continue_on_error: true
            data: {}
            target:
              entity_id: switch.prise_de_l_entree
          - action: switch.turn_on
            target:
              entity_id: switch.machine_a_cafe_100_automatique
            data: {}
          - action: input_button.press
            metadata: {}
            target:
              entity_id:
                - input_button.climatisation_stop
            data: {}
        note: Mode Réveil → déverrouille serrure garage, allume lumières s'il fait encore sombre, active prises+purificateur+café, arrête la climatisation
      - conditions:
          - condition: state
            entity_id: input_select.presence_action
            state: Arrivée
        sequence:
          - if:
              - condition: state
                entity_id: lock.serrure_du_garage
                state: locked
            then:
              - action: lock.unlock
                data: {}
                target:
                  entity_id: lock.serrure_du_garage
                continue_on_error: true
          - if:
              - condition: sun
                before: sunrise
                before_offset: '1800'
                after: sunset
                after_offset: '-1800'
            then:
              - action: light.turn_on
                data: {}
                target:
                  entity_id:
                    - light.lumiere_de_l_entree
          - action: switch.turn_on
            target:
              entity_id:
                - switch.multiprise_du_salon_droite_2_purificateur
                - switch.salon_multiprise_du_salon_gauche_2_ventilateur
            data: {}
          - action: input_select.select_option
            metadata: {}
            data:
              option: Présent
            target:
              entity_id: input_select.presence_action
        note: Mode Arrivée → déverrouille serrure garage, allume entrée si sombre, active purificateur, bascule vers Présent
      - conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: input_select.presence_action
                state: Extinction
              - condition: state
                entity_id: input_select.presence_action
                state: Couché
        sequence:
          - if:
              - condition: state
                entity_id: input_select.hifi_action
                state: 'OFF'
            then:
              - action: automation.trigger
                metadata: {}
                data:
                  skip_condition: true
                target:
                  entity_id:
                    - automation.gestion_de_la_hifi
            else:
              - action: input_select.select_option
                metadata: {}
                data:
                  option: 'OFF'
                target:
                  entity_id: input_select.hifi_action
          - if:
              - condition: state
                entity_id: input_select.presence_action
                state: Couché
            then:
              - if:
                  - condition: or
                    conditions:
                      - condition: time
                        before: 02:00:00
                      - condition: sun
                        after: sunset
                        after_offset: '-1800'
                then:
                  - action: light.turn_on
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id:
                        - light.lumiere_de_l_entree
                        - light.lumiere_de_lescalier
                        - light.lumiere_du_palier
                        - light.lumiere_de_la_suite_parentale
              - action: switch.turn_on
                continue_on_error: true
                target:
                  entity_id: switch.prise_de_l_entree
                data: {}
          - parallel:
              - if:
                  - condition: state
                    entity_id: lock.serrure_de_l_entree
                    state: unlocked
                then:
                  - action: lock.lock
                    data: {}
                    target:
                      entity_id: lock.serrure_de_l_entree
                    continue_on_error: true
              - if:
                  - condition: state
                    entity_id: lock.serrure_du_garage
                    state: unlocked
                then:
                  - action: lock.lock
                    data: {}
                    target:
                      entity_id: lock.serrure_du_garage
                    continue_on_error: true
          - parallel:
              - action: light.turn_off
                continue_on_error: true
                data: {}
                target:
                  entity_id:
                    - light.lumiere_de_la_terrasse
                    - light.lumiere_du_garage
                    - light.lumiere_du_cellier
                    - light.lumiere_de_la_cuisine
                    - light.lumiere_de_lexterieur
                    - light.lumiere_du_meuble_de_la_cuisine
                    - light.lumiere_du_dressing
              - action: switch.turn_off
                continue_on_error: true
                data: {}
                target:
                  entity_id:
                    - switch.garage_multiprise_du_garage_1_meuleuse
                    - switch.garage_multiprise_du_garage_2_bosh
                    - switch.garage_multiprise_du_garage_3_husqvarna
                    - switch.garage_multiprise_du_garage_4_compresseur
                    - switch.multiprise_du_salon_droite_1_alimentation_apple
                    - switch.bureau_multiprise_du_bureau_2_chargeur
                    - switch.bureau_multiprise_du_bureau_3_lampe
                    - switch.terrasse_prise_de_la_terrasse_socket_1
                enabled: true
              - action: switch.turn_off
                continue_on_error: true
                data: {}
                target:
                  entity_id:
                    - switch.prise_de_la_hotte
                    - switch.contacteur_du_four
              - action: switch.turn_off
                continue_on_error: true
                data: {}
                target:
                  entity_id:
                    - switch.suite_parentale_multiprise_de_la_suite_parentale_3_tv_apple_tv
              - if:
                  - condition: state
                    entity_id: alarm_control_panel.alarme
                    state: armed_away
                then:
                  - action: light.turn_off
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id:
                        - light.armoire_de_toilette_de_la_salle_d_eau
                        - light.armoire_de_toilette_de_la_salle_de_bain
                        - light.plafonnier_de_la_salle_d_eau
                        - light.plafonnier_de_la_salle_de_bain
                        - light.lumiere_de_l_entree
                        - light.lumiere_de_lescalier
                        - light.lumiere_du_wc_de_letage
                        - light.lumiere_du_palier
                        - light.lumiere_du_wc_du_rdc
                  - if:
                      - condition: numeric_state
                        entity_id: cover.store_pergola
                        attribute: current_position
                        below: 100
                    then:
                      - action: cover.open_cover
                        data: {}
                        target:
                          entity_id: cover.store_pergola
                  - if:
                      - condition: state
                        entity_id: input_boolean.purification
                        state: 'off'
                    then:
                      - action: switch.turn_off
                        continue_on_error: true
                        data: {}
                        target:
                          entity_id:
                            - switch.multiprise_du_salon_droite_2_purificateur
                            - switch.salon_multiprise_du_salon_gauche_2_ventilateur
              - if:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: alarm_control_panel.alarme
                        state: armed_away
                      - condition: switch.is_on
                        target:
                          entity_id: input_boolean.seul_a_la_maison
                        options:
                          behavior: any
                          for: 00:00:00
                      - condition: state
                        entity_id: input_select.presence_salon
                        state: Absent
                then:
                  - action: light.turn_off
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id:
                        - light.lumiere_du_sejour
                        - light.lumiere_du_salon
                enabled: true
              - if:
                  - condition: state
                    entity_id: alarm_control_panel.alarme
                    state: armed_away
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: input_select.presence_suite_parentale
                        state: Absent
                      - condition: switch.is_on
                        target:
                          entity_id: input_boolean.seul_a_la_maison
                        options:
                          behavior: any
                          for: 00:00:00
                    enabled: true
                then:
                  - action: light.turn_off
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id:
                        - light.lumiere_de_la_suite_parentale
              - if:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: alarm_control_panel.alarme
                        state: armed_away
                      - condition: state
                        entity_id: input_select.presence_bureau
                        state: Absent
                then:
                  - action: light.turn_off
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id:
                        - light.lumiere_du_bureau
              - if:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: alarm_control_panel.alarme
                        state: armed_away
                      - condition: state
                        entity_id: input_select.presence_chambre
                        state: Absent
                then:
                  - action: light.turn_off
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id:
                        - light.lumiere_de_la_chambre
            continue_on_error: true
          - if:
              - condition: state
                entity_id: input_select.presence_action
                state: Couché
            then:
              - if:
                  - condition: state
                    entity_id: input_select.sonos_action
                    state: COUCHE
                then:
                  - action: automation.trigger
                    metadata: {}
                    data:
                      skip_condition: true
                    target:
                      entity_id:
                        - automation.gestion_des_sonos
                else:
                  - action: input_select.select_option
                    metadata: {}
                    data:
                      option: COUCHE
                    target:
                      entity_id: input_select.sonos_action
              - delay:
                  hours: 0
                  minutes: 0
                  seconds: 10
                  milliseconds: 0
              - action: media_player.volume_set
                data:
                  volume_level: '{{ states(''input_number.volume_sonos_base'') | float + 0.05 }}'
                target:
                  entity_id:
                    - media_player.salle_d_eau
                    - media_player.suite_parentale
        note: 'Mode Extinction/Couché → éteint HiFi, verrouille les deux serrures, éteint lumières/prises non essentielles ; alarme armée : store pergola ouvert ; Couché : veilleuses + SONOS COUCHE'
mode: restart
