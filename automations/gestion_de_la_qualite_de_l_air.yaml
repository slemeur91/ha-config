alias: Gestion de la Qualité de l'Air
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Déclencheurs :**
  - Tout changement de valeur de l'un des 6 capteurs : PM2.5 (moniteur Xiaomi, purificateur Mi Air, Dyson Salon), PM10, VOC et NO2 du Dyson

  **Correction du 11/10/2026 :** les déclencheurs étaient des `numeric_state` avec `above: 0`, qui ne s'activaient qu'au passage de 0 à une valeur positive (donc jamais pour le moniteur Xiaomi, le Mi Air et le VOC, qui ne retombent pas à 0). Les seuils sont désormais réévalués à chaque nouvelle mesure.

  **Conséquence :** un purificateur allumé à la main alors que l'air est propre est éteint dès la mesure suivante.

  **Fonctionnement :**
  1. Si seuils de pollution dépassés (PM2.5 > 40, PM10 > 60, VOC > 6 ou NO2 > 6) → allume les purificateurs (Mi Air + Dyson Salon) s'ils sont éteints, active le flag purification.
  2. Si tous les seuils sont en dessous des valeurs basses (PM2.5 < 35 — le moniteur Xiaomi étant aussi accepté s'il est indisponible —, PM10 < 45, VOC < 4, NO2 < 4) → éteint les purificateurs, coupe les prises du purificateur et du ventilateur si l'alarme est active et que la purification était en cours, désactive le flag purification.

  **Entités principales :**
  - `fan.zhimi_m1_6186_air_purifier` / `fan.salon` : purificateurs Mi Air et Dyson
  - `input_boolean.purification` : flag état purification
  - `sensor.salon_volatile_organic_compounds_index` / `sensor.salon_nitrogen_dioxide_index` : qualité air Dyson
triggers:
  - trigger: state
    entity_id:
      - sensor.zhimi_v1_5052_pm25_density
      - sensor.zhimi_m1_6186_pm25_density
      - sensor.salon_pm_2_5
      - sensor.salon_pm_10
      - sensor.salon_volatile_organic_compounds_index
      - sensor.salon_nitrogen_dioxide_index
    to: null
    note: Réévaluation à chaque nouvelle mesure d'un des 6 capteurs (changement de valeur)
conditions: []
actions:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: numeric_state
                entity_id: sensor.zhimi_v1_5052_pm25_density
                above: 40
              - condition: numeric_state
                entity_id: sensor.zhimi_m1_6186_pm25_density
                above: 40
              - condition: numeric_state
                entity_id: sensor.salon_pm_2_5
                above: 40
              - condition: numeric_state
                entity_id: sensor.salon_pm_10
                above: 60
              - condition: numeric_state
                entity_id: sensor.salon_volatile_organic_compounds_index
                above: 6
              - condition: numeric_state
                entity_id: sensor.salon_nitrogen_dioxide_index
                above: 6
        sequence:
          - parallel:
              - if:
                  - condition: state
                    entity_id: fan.zhimi_m1_6186_air_purifier
                    state: 'off'
                then:
                  - action: fan.turn_on
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id: fan.zhimi_m1_6186_air_purifier
              - if:
                  - condition: state
                    entity_id: fan.salon
                    state: 'off'
                then:
                  - action: fan.turn_on
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id: fan.salon
          - action: input_boolean.turn_on
            metadata: {}
            data: {}
            target:
              entity_id: input_boolean.purification
        note: Si seuils dépassés (PM2.5 > 40, PM10 > 60, VOC > 6 ou NO2 > 6) → allume les purificateurs s'ils sont éteints, active le flag purification
      - conditions:
          - condition: and
            conditions:
              - condition: or
                conditions:
                  - condition: numeric_state
                    entity_id: sensor.zhimi_v1_5052_pm25_density
                    below: 35
                  - condition: state
                    entity_id: sensor.zhimi_v1_5052_pm25_density
                    state:
                      - unavailable
              - condition: numeric_state
                entity_id: sensor.zhimi_m1_6186_pm25_density
                below: 35
              - condition: numeric_state
                entity_id: sensor.salon_pm_2_5
                below: 35
              - condition: numeric_state
                entity_id: sensor.salon_pm_10
                below: 45
              - condition: numeric_state
                entity_id: sensor.salon_volatile_organic_compounds_index
                below: 4
              - condition: numeric_state
                entity_id: sensor.salon_nitrogen_dioxide_index
                below: 4
        sequence:
          - parallel:
              - if:
                  - condition: state
                    entity_id: fan.zhimi_m1_6186_air_purifier
                    state: 'on'
                then:
                  - action: fan.turn_off
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id: fan.zhimi_m1_6186_air_purifier
              - if:
                  - condition: state
                    entity_id: fan.salon
                    state: 'on'
                then:
                  - action: fan.turn_off
                    continue_on_error: true
                    data: {}
                    target:
                      entity_id: fan.salon
          - if:
              - condition: and
                conditions:
                  - condition: state
                    entity_id: input_boolean.alarme
                    state:
                      - 'on'
                  - condition: state
                    entity_id: input_boolean.purification
                    state: 'on'
            then:
              - action: switch.turn_off
                continue_on_error: true
                data: {}
                target:
                  entity_id:
                    - switch.multiprise_du_salon_droite_2_purificateur
                    - switch.salon_multiprise_du_salon_gauche_2_ventilateur
          - action: input_boolean.turn_off
            metadata: {}
            data: {}
            target:
              entity_id: input_boolean.purification
        note: Si tous les seuils sous les valeurs basses (PM2.5 < 35, PM10 < 45, VOC < 4, NO2 < 4) → éteint les purificateurs, coupe les switches physiques si alarme armée, désactive le flag purification
mode: queued
max: 10
