alias: Gestion de la Lumière de l'Entrée
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Déclencheurs :**
  - Sonnette du portier (`binary_sensor.exterieur_slm_portier_visiteur` → on)
  - Présence devant le portier (`binary_sensor.exterieur_slm_portier_personne` → on)
  - Ouverture de la porte d'entrée (`binary_sensor.do_porte_entree`)

  **Fonctionnement :**
  1. Si période sombre (de 30 min avant le coucher du soleil à 30 min après le lever) → allume `light.lumiere_de_lexterieur`, attend 5 s.
  2. Si la lumière est allumée → attend 5 min puis éteint automatiquement.

  **Note :** mode `restart` : une nouvelle détection pendant le délai de 5 min relance l'extinction à zéro.

  **Entités principales :**
  - `binary_sensor.exterieur_slm_portier_visiteur`, `binary_sensor.exterieur_slm_portier_personne`, `binary_sensor.do_porte_entree`
  - `light.lumiere_de_lexterieur`
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.exterieur_slm_portier_visiteur
    to:
      - 'on'
  - trigger: state
    entity_id:
      - binary_sensor.exterieur_slm_portier_personne
    to:
      - 'on'
    enabled: true
  - trigger: door.opened
    target:
      entity_id: binary_sensor.do_porte_entree
    options:
      behavior: each
      for: 00:00:00
conditions: []
actions:
  - if:
      - condition: sun
        before: sunrise
        before_offset: '1800'
        after: sunset
        after_offset: '-1800'
    then:
      - action: light.turn_on
        target:
          entity_id:
            - light.lumiere_de_lexterieur
        data: {}
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
    note: Période sombre (de 30 min avant le coucher à 30 min après le lever) → allume la lumière extérieure
  - if:
      - condition: light.is_on
        target:
          entity_id:
            - light.lumiere_de_lexterieur
        options:
          behavior: any
          for: 00:00:00
    then:
      - delay:
          hours: 0
          minutes: 5
          seconds: 0
          milliseconds: 0
      - action: light.turn_off
        target:
          entity_id:
            - light.lumiere_de_lexterieur
        data: {}
    note: 'Lumière allumée → attend 5 min puis éteint (mode restart : une nouvelle détection relance le délai à zéro)'
mode: restart
