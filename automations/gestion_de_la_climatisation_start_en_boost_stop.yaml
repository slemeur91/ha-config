alias: Gestion de la Climatisation - Start en Boost / Stop
description: >-
  **Statut :** Finalisé

  **Evolution :** Aucune


  **Déclencheurs :**

  - Appui sur `input_button.climatisation_boost_start`

  - Appui sur `input_button.climatisation_stop`


  **Fonctionnement :**

  1. Boost : pour chacune des 4 clim (Chambre, Suite parentale, Bureau, Séjour),
  l'allume si elle est éteinte puis (re)lance systématiquement le préréglage
  "boost" (même si déjà en boost), en parallèle sur les 4.

  2. Stop : éteint chaque clim encore allumée parmi les 4, en parallèle.


  **Entités principales :**

  - `climate.climatisation_de_la_chambre`,
  `climate.climatisation_de_la_suite_parentale`,
  `climate.climatisation_du_bureau`, `climate.climatisation_du_sejour`

  - `input_button.climatisation_boost_start`, `input_button.climatisation_stop`
triggers:
  - trigger: state
    entity_id: input_button.climatisation_boost_start
    id: boost
  - trigger: state
    entity_id: input_button.climatisation_stop
    id: stop
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: boost
        sequence:
          - parallel:
              - sequence:
                  - if:
                      - condition: state
                        entity_id: climate.climatisation_de_la_chambre
                        state: "off"
                    then:
                      - action: climate.turn_on
                        target:
                          entity_id: climate.climatisation_de_la_chambre
                      - delay:
                          seconds: 2
                    note: N'allume que si éteinte
                  - action: climate.set_preset_mode
                    target:
                      entity_id: climate.climatisation_de_la_chambre
                    data:
                      preset_mode: boost
                    note: Relance systématique du boost, même si déjà en boost
              - sequence:
                  - if:
                      - condition: state
                        entity_id: climate.climatisation_de_la_suite_parentale
                        state: "off"
                    then:
                      - action: climate.turn_on
                        target:
                          entity_id: climate.climatisation_de_la_suite_parentale
                      - delay:
                          seconds: 2
                  - action: climate.set_preset_mode
                    target:
                      entity_id: climate.climatisation_de_la_suite_parentale
                    data:
                      preset_mode: boost
              - sequence:
                  - if:
                      - condition: state
                        entity_id: climate.climatisation_du_bureau
                        state: "off"
                    then:
                      - action: climate.turn_on
                        target:
                          entity_id: climate.climatisation_du_bureau
                      - delay:
                          seconds: 2
                  - action: climate.set_preset_mode
                    target:
                      entity_id: climate.climatisation_du_bureau
                    data:
                      preset_mode: boost
              - sequence:
                  - if:
                      - condition: state
                        entity_id: climate.climatisation_du_sejour
                        state: "off"
                    then:
                      - action: climate.turn_on
                        target:
                          entity_id: climate.climatisation_du_sejour
                      - delay:
                          seconds: 2
                  - action: climate.set_preset_mode
                    target:
                      entity_id: climate.climatisation_du_sejour
                    data:
                      preset_mode: boost
      - conditions:
          - condition: trigger
            id: stop
        sequence:
          - parallel:
              - sequence:
                  - if:
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: climate.climatisation_de_la_chambre
                            state: "off"
                    then:
                      - action: climate.turn_off
                        target:
                          entity_id: climate.climatisation_de_la_chambre
                    note: N'éteint que si pas déjà éteinte
              - sequence:
                  - if:
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: climate.climatisation_de_la_suite_parentale
                            state: "off"
                    then:
                      - action: climate.turn_off
                        target:
                          entity_id: climate.climatisation_de_la_suite_parentale
              - sequence:
                  - if:
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: climate.climatisation_du_bureau
                            state: "off"
                    then:
                      - action: climate.turn_off
                        target:
                          entity_id: climate.climatisation_du_bureau
              - sequence:
                  - if:
                      - condition: not
                        conditions:
                          - condition: state
                            entity_id: climate.climatisation_du_sejour
                            state: "off"
                    then:
                      - action: climate.turn_off
                        target:
                          entity_id: climate.climatisation_du_sejour
mode: restart
