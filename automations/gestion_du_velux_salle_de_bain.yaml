alias: Gestion du Velux - Salle de bain
description: '**Statut :** Finalisé

  **Evolution :** Aucune


  **Fonctionnement :**

  Automatisation basée sur le blueprint `Volets/Gestion_des_velux.yaml` : pilote le
  velux selon le soleil, les alertes météo, la température intérieure/extérieure (ouverture
  pour aération l''été ou chauffage passif l''hiver, fermeture pour protection thermique),
  la pluie, et une dérogation de 15mn en cas d''ouverture manuelle (avec anti-rebond
  45s sur la détection de mouvement).


  **Entités principales :**

  - `cover.velux_de_la_salle_de_bain` : velux piloté

  - `climate.chauffage_de_la_salle_de_bain_nodeid_5_climate` : chauffage de la pièce

  - `sensor.detecteur_de_la_salle_de_bain_nodeid_28_temperature_air` : température
  intérieure secondaire

  - `binary_sensor.velux_de_la_salle_de_bain_pluie` : capteur de pluie

  - `input_button.velux_salle_de_bain_fermer` : réactivation manuelle

  - `timer.velux_salle_de_bain_timer` : timer de dérogation'
use_blueprint:
  path: Volets/Gestion_des_velux.yaml
  input:
    velux_name: Salle de bain
    velux_target: cover.velux_de_la_salle_de_bain
    temp_secondaire: sensor.detecteur_de_la_salle_de_bain_nodeid_28_temperature_air
    velux_button: input_button.velux_salle_de_bain_fermer
    chauffage_target: climate.chauffage_de_la_salle_de_bain_nodeid_5_climate
    velux_timer: timer.velux_salle_de_bain_timer
    pluie_target: binary_sensor.velux_de_la_salle_de_bain_pluie
