alias: Notification appareils en batterie faible - Mail hebdomadaire
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Déclencheurs :**
  - Chaque vendredi à 19h00

  **Fonctionnement :**
  1. Parcourt les capteurs de l'intégration Battery Notes et retient ceux dont l'attribut `battery_low` est vrai (nom de l'appareil, niveau, type et quantité de piles).
  2. S'arrête sans rien envoyer si aucun appareil n'est en batterie faible.
  3. Sinon, compose la liste et envoie un mail récapitulatif (type 'Batteries') via `script.notification_mail`.

  **Entités principales :**
  - Intégration `battery_notes` : source des niveaux de batterie
  - `script.notification_mail` : envoi du mail récapitulatif
triggers:
  - at: '19:00:00'
    weekday:
      - fri
    trigger: time
conditions: []
actions:
  - variables:
      low_battery_devices: |-
        {% set devices = namespace(list=[]) %}
        {% for entity_id in integration_entities('battery_notes') %}
          {% set state = states[entity_id] %}
          {% if state and state.domain == 'sensor' and state.attributes.get('battery_low', false) %}
            {% set devices.list = devices.list + [{
              'name': state.attributes.get('device_name', entity_id),
              'battery_type_and_quantity': state.attributes.get('battery_type_and_quantity', 'Inconnu'),
              'battery_level': state.state
            }] %}
          {% endif %}
        {% endfor %}
        {{ devices.list }}
    note: Construit la liste des appareils Battery Notes en batterie faible
  - condition: template
    value_template: '{{ low_battery_devices | length > 0 }}'
    note: Arrêt si aucun appareil en batterie faible
  - variables:
      message_corp: |-
        Liste des appareils avec batterie faible :
        {% for device in low_battery_devices -%}
          - {{ device.name }} à {{ device.battery_level | int }}% : {{ device.battery_type_and_quantity }}
        {% endfor %}
  - action: script.turn_on
    target:
      entity_id:
        - script.notification_mail
    data:
      variables:
        message_type: Batteries
        message_corp: '{{ message_corp }}'
    note: Envoi du mail récapitulatif
mode: restart
