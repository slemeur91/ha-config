alias: Notification de la Boîte aux Lettres
description: |-
  **Statut :** En test
  **Evolution :** Correction du 11/10/2026 — l'envoi dépendait d'un test sur la variable `message_courrier`, jamais définie ; l'envoi est désormais fait directement dans chaque branche.

  **Convention des capteurs :** les deux contacts sont à `on` au repos (fermé) et passent brièvement à `off` à l'ouverture.

  **Déclencheurs :**
  - Ouverture de la porte principale de la boîte aux lettres (`binary_sensor.porte_boite_aux_lettres` → off) — id: Porte, cas colis
  - Ouverture de la trappe à lettres (`binary_sensor.trappe_boite_aux_lettres` → off) — id: Trappe, cas lettre

  **Fonctionnement :**
  1. Porte principale ouverte → envoie mail + SMS 'La boîte aux lettres a été ouverte : colis'.
  2. Trappe à lettres ouverte, uniquement si la porte principale est fermée (`on`) → envoie mail + SMS 'La trappe de la boîte aux lettres a été ouverte : lettre'. Si la porte est ouverte au même moment (relevé du courrier), rien n'est envoyé pour la trappe.
  3. Pas de notification vocale.

  **Entités principales :**
  - `binary_sensor.porte_boite_aux_lettres` : porte principale (colis)
  - `binary_sensor.trappe_boite_aux_lettres` : trappe à lettres
  - `script.notification_mail` / `script.notification_sms` : envoi des alertes
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.porte_boite_aux_lettres
    to:
      - 'off'
    id: Porte
  - trigger: state
    entity_id:
      - binary_sensor.trappe_boite_aux_lettres
    to:
      - 'off'
    id: Trappe
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - Porte
        sequence:
          - action: script.turn_on
            target:
              entity_id:
                - script.notification_mail
                - script.notification_sms
            data:
              variables:
                message_type: Boite aux lettres
                message_corp: 'La boîte aux lettres a été ouverte : colis'
        note: Porte principale ouverte → mail + SMS 'colis'
      - conditions:
          - condition: trigger
            id:
              - Trappe
          - condition: state
            entity_id: binary_sensor.porte_boite_aux_lettres
            state:
              - 'on'
        sequence:
          - action: script.turn_on
            target:
              entity_id:
                - script.notification_mail
                - script.notification_sms
            data:
              variables:
                message_type: Boite aux lettres
                message_corp: 'La trappe de la boîte aux lettres a été ouverte : lettre'
        note: Trappe à lettres ouverte alors que la porte principale est fermée (on) → mail + SMS 'lettre'
mode: single
