alias: Notification de la Boîte aux Lettres
description: '**Statut :** En test

  **Evolution :** Corrections


  **Déclencheurs :**

  - Fermeture de la porte principale de la boîte aux lettres (`binary_sensor.porte_boite_aux_lettres`
  → off) — cas colis

  - Fermeture de la trappe à lettres (`binary_sensor.trappe_boite_aux_lettres` → off),
  uniquement si la porte principale est déjà fermée — cas lettre


  **Fonctionnement :**

  1. Porte principale refermée → compose le message "colis".

  2. Trappe à lettres refermée (porte déjà fermée) → compose le message "lettre".

  3. Envoie mail et SMS avec le message composé (notification vocale actuellement
  désactivée).


  **Entités principales :**

  - `binary_sensor.porte_boite_aux_lettres` : porte principale (colis)

  - `binary_sensor.trappe_boite_aux_lettres` : trappe à lettres

  - `script.notification_mail` / `script.notification_sms` : envoi des alertes'
triggers:
- trigger: state
  entity_id:
  - binary_sensor.porte_boite_aux_lettres
  to:
  - 'off'
  id: Porte
- trigger: state
  entity_id:
  - binary_sensor.trappe_boite_aux_lettres
  to:
  - 'off'
  id: Trappe
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id:
      - Porte
    sequence:
    - variables:
        message_courrier: 'La boîte aux lettres a été ouverte : colis'
    note: Porte principale refermée → compose le message 'colis'
  - conditions:
    - condition: trigger
      id:
      - Trappe
    sequence:
    - condition: state
      state:
      - 'off'
      entity_id: binary_sensor.porte_boite_aux_lettres
    - variables:
        message_courrier: 'La trappe de la boîte aux lettres a été ouverte : lettre'
    note: Trappe à lettres refermée, uniquement si la porte principale est déjà fermée
      → compose le message 'lettre'
- if:
  - condition: template
    value_template: '{{ message_courrier != null }}'
  then:
  - action: script.notification_vocale
    data:
      message_vocal: '{{ message_courrier }}'
    enabled: false
  - action: script.notification_mail
    data:
      message_type: Boite aux lettres
      message_mail: '{{ message_courrier }}'
  - action: script.notification_sms
    data:
      message_type: Boite aux lettres
      message_sms: '{{ message_courrier }}'
mode: single
