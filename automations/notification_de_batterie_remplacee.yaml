alias: Notification de batterie remplacée
description: '**Statut :** Finalisé

  **Evolution :** Aucune


  **Déclencheurs :**

  - Événement `battery_notes_battery_increased` (niveau de batterie en hausse significative)


  **Fonctionnement :**

  1. Envoie une notification HA (via script.notification) suggérant de marquer la
  batterie comme remplacée dans Battery Notes.

  2. Le texte s''adapte selon le type de batterie (rechargeable ou pile, via trigger.event.data.battery_type).

  3. notification_id stable (battery_increased-device_id-source_entity_id) pour éviter
  les notifications dupliquées si l''évènement se répète pour le même appareil.


  **Entités principales :**

  - Événement `battery_notes_battery_increased` (intégration Battery Notes)

  - `script.notification_ha` : envoi de la notification'
triggers:
- trigger: event
  event_type: battery_notes_battery_increased
conditions: []
actions:
- action: script.notification_ha
  data:
    message_type: '{{ ''Batterie rechargée'' if trigger.event.data.battery_type ==
      ''Rechargeable'' else ''Batterie augmentée'' }} — {{ trigger.event.data.device_name
      }}'
    message_ha: '{%- if trigger.event.data.battery_type == ''Rechargeable'' -%}Le
      niveau de batterie est passé de {{ trigger.event.data.previous_battery_level
      }}% à {{ trigger.event.data.battery_level }}%. Si elle a été rechargée, vous
      pouvez la marquer comme remplacée dans Battery Notes.{%- else -%}Le niveau de
      batterie est passé de {{ trigger.event.data.previous_battery_level }}% à {{
      trigger.event.data.battery_level }}%. Si la pile a été remplacée, vous pouvez
      la marquer comme remplacée dans Battery Notes.{%- endif -%}'
    notification_id: battery_increased-{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id
      }}
  enabled: false
- action: script.turn_on
  target:
    entity_id:
    - script.notification_ha
  data:
    variables:
      message_type: '{{ ''Batterie rechargée'' if trigger.event.data.battery_type
        == ''Rechargeable'' else ''Batterie augmentée'' }} — {{ trigger.event.data.device_name
        }}'
      message_ha: '{%- if trigger.event.data.battery_type == ''Rechargeable'' -%}Le
        niveau de batterie est passé de {{ trigger.event.data.previous_battery_level
        }}% à {{ trigger.event.data.battery_level }}%. Si elle a été rechargée, vous
        pouvez la marquer comme remplacée dans Battery Notes.{%- else -%}Le niveau
        de batterie est passé de {{ trigger.event.data.previous_battery_level }}%
        à {{ trigger.event.data.battery_level }}%. Si la pile a été remplacée, vous
        pouvez la marquer comme remplacée dans Battery Notes.{%- endif -%}'
      notification_id: battery_increased-{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id
        }}
  enabled: true
mode: queued
