alias: Surveillance - Automatisations désactivées
description: >-
  Statut : Finalise

  Evolution : Aucune


  Declencheurs :

  - Chaque jour a 8h00


  Conditions :

  - Au moins une automatisation desactivee


  Fonctionnement :

  1. Pour chaque automatisation desactivee, appelle script.notification
  (Notification HA) avec un notification_id stable par automatisation (mise a
  jour, pas de doublon si toujours desactivee le lendemain).


  Entites principales :

  - automation.* : ensemble des automatisations surveillees (etat off)

  - script.notification (Notification HA) : creation des notifications
triggers:
  - at: "08:00:00"
    trigger: time
conditions:
  - condition: template
    value_template: >
      {{ states.automation | selectattr('state', 'eq', 'off') | list | count > 0
      }}
actions:
  - note: >-
      Envoie une notification HA distincte (Notification HA) pour chaque
      automatisation désactivée
    repeat:
      for_each: "{{ states.automation | selectattr('state', 'eq', 'off') | list }}"
      sequence:
        - action: script.notification_ha
          data:
            message_type: Automatisations désactivées
            message_ha: L'automatisation {{ repeat.item.name }} est désactivée.
            notification_id: automation_disabled-{{ repeat.item.entity_id }}
