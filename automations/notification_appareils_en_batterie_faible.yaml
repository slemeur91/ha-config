alias: Notification appareils en batterie faible
description: >-
  **Statut :** Finalisé

  **Evolution :** Aucune


  **Déclencheurs :**

  - Événement `battery_notes_battery_threshold` (batterie passée en dessous du
  seuil)

  - Événement `battery_notes_battery_threshold` (batterie revenue au-dessus du
  seuil)


  **Fonctionnement :**

  1. Batterie faible → appelle le script Notification HA
  (`script.notification_ha`) avec le nom de l'appareil, le niveau de batterie et
  le type de pile nécessaire, en passant un notification_id stable.

  2. Batterie revenue à la normale → supprime automatiquement la notification
  persistante correspondante via `persistent_notification.dismiss` (même
  notification_id).
triggers:
  - event_type: battery_notes_battery_threshold
    event_data:
      battery_low: true
    id: low
    alias: Batterie passée en niveau faible
    trigger: event
  - event_type: battery_notes_battery_threshold
    event_data:
      battery_low: false
    id: high
    alias: Batterie revenue à un niveau suffisant
    trigger: event
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - low
        sequence:
          - action: script.notification_ha
            data:
              message_type: Batterie faible — {{ trigger.event.data.device_name }}
              message_ha: >
                L'appareil a un niveau de batterie de {{
                trigger.event.data.battery_level }}% {{ '\n' -}} Il vous faut {{
                trigger.event.data.battery_quantity }}× {{
                trigger.event.data.battery_type }}
              notification_id: >-
                {{ trigger.event.data.device_id }}-{{
                trigger.event.data.source_entity_id }}
        note: >-
          Batterie sous le seuil -> appelle script.notification_ha (Notification
          HA) avec le nom de l'appareil, niveau et type de pile requis
      - conditions:
          - condition: trigger
            id:
              - high
        sequence:
          - action: persistent_notification.dismiss
            data:
              notification_id: >-
                {{ trigger.event.data.device_id }}-{{
                trigger.event.data.source_entity_id }}
        note: >-
          Batterie revenue à la normale → supprime automatiquement la
          notification persistante correspondante
mode: queued
