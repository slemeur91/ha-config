alias: Gestion des Statistiques journalières de GAZPAR – Réécriture
description: >-
  **Statut :** Finalisé

  **Evolution :** Aucune


  **Déclencheurs :**

  - Changement de `sensor.gazpar_cheptainville_card` (nouvelles données reçues
  via gazpar2mqtt)


  **Conditions :**

  - Sensor non indisponible / inconnu


  **Fonctionnement :**

  1. Lance le script pyscript `gazpar_update` pour réécrire les dernières
  données de consommation gaz dans les statistiques long-terme de HA.


  **Entités principales :**

  - `sensor.gazpar_cheptainville_card` : données brutes GAZPAR

  - `pyscript.gazpar_update` : réécriture des statistiques
triggers:
  - trigger: state
    entity_id: sensor.gazpar_cheptainville_card
conditions:
  - condition: not
    conditions:
      - condition: state
        entity_id: sensor.gazpar_cheptainville_card
        state:
          - unavailable
          - unknown
actions:
  - action: pyscript.gazpar_import_all
    data: {}
    enabled: false
    note: "Désactivé : import complet, ne sert qu'en cas de reprise d'historique"
  - action: pyscript.gazpar_update
    data: {}
mode: single
max_exceeded: silent
