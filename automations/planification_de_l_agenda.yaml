alias: Planification de l'Agenda
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Déclencheurs :**
  - Chaque jour à 00:15
  - Changement de `input_boolean.alarme` — id: Désactivation Alarme
  - Appui sur `input_button.planification_agenda`
  - Changement de `input_select.volets_mode` (Été / Hiver)

  **Fonctionnement (deux blocs exécutés en parallèle) :**
  1. Calendrier, si déclenché par l'alarme et que `input_select.calendrier_action` vaut Absent → `input_select.calendrier` passe à Absent si l'alarme est active, à Repos sinon.
  2. Calendrier, autres déclencheurs → interroge `calendar.agenda` pour la journée, extrait les résumés d'événements, puis selon les mots-clés :
     - Absent / Vacance(s) → `chauffage_action` et `calendrier_action` = Absent ; `calendrier` = Absent si l'alarme est armée (absent), sinon Repos ;
     - TéléTravail → les trois sélecteurs = TéléTravail ;
     - jour non travaillé (`binary_sensor.workday_sensor` à off), ARTT ou Congé(s) → les trois sélecteurs = Repos ;
     - sinon → Travail.
     Dans chaque cas, active le sous-calendrier correspondant (`calendar.agenda_absent` / `_teletravail` / `_we_ferie_repos` / `_travail`) et désactive les trois autres, puis envoie un mail avec le mode retenu.
  3. HorsGel → activé si l'une des conditions est vraie : (période du 16 avril au 14 octobre ET `input_select.volets_mode` = Eté), OU température extérieure > 22°C, OU (alarme armée absent ET calendrier = Absent). Désactivé sinon. Lorsqu'il est activé et que l'alarme est armée (absent), met aussi `input_select.domicile` à Vacances (calendrier Absent) ou Absent.

  **Entités principales :**
  - `calendar.agenda` : source de la planification journalière
  - `input_select.calendrier` / `input_select.calendrier_action` / `input_select.chauffage_action` : modes actifs
  - `binary_sensor.workday_sensor` : jour travaillé ou non
  - `input_boolean.chauffage_horsgel` : activation du mode hors-gel global
  - `input_select.domicile` : mis à jour en cas d'absence
triggers:
  - at: 00:15:00
    trigger: time
  - entity_id:
      - input_boolean.alarme
    id: Désactivation Alarme
    to: null
    trigger: state
  - entity_id:
      - input_button.planification_agenda
    trigger: state
  - trigger: state
    entity_id: input_select.volets_mode
conditions: []
actions:
  - parallel:
      - note: 'Logique calendrier → si trigger alarme: maintient Absent ou bascule Repos ; sinon: interroge calendar.agenda et positionne le mode selon mots-clés (Absent/TéléTravail/ARTT/Congé/Repos/Travail)'
        if:
          - condition: trigger
            id:
              - Désactivation Alarme
        then:
          - if:
              - condition: state
                entity_id: input_select.calendrier_action
                state: Absent
            then:
              - if:
                  - condition: state
                    entity_id: input_boolean.alarme
                    state: 'on'
                then:
                  - action: input_select.select_option
                    data:
                      option: Absent
                    target:
                      entity_id:
                        - input_select.calendrier
                else:
                  - action: input_select.select_option
                    data:
                      option: Repos
                    target:
                      entity_id:
                        - input_select.calendrier
        else:
          - action: calendar.get_events
            target:
              entity_id: calendar.agenda
            data:
              start_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 00:00:00Z'
              end_date_time: '{{ now().strftime(''%Y-%m-%d'') }} 23:59:59Z'
            response_variable: events_today
          - variables:
              today: '{{ now().strftime(''%Y-%m-%d'') }}'
              summaries: |-
                {{ events_today['calendar.agenda']['events']
                   | selectattr('start', '>=', today)
                   | map(attribute='summary') | list }}
            enabled: false
          - variables:
              today: '{{ now().strftime(''%Y-%m-%d'') }}'
              summaries: |-
                {{ events_today['calendar.agenda']['events']
                   | map(attribute='summary') | list }}
          - choose:
              - conditions:
                  - condition: or
                    conditions:
                      - condition: template
                        value_template: '{{ summaries | contains(''Absent'') }}'
                      - condition: template
                        value_template: '{{ summaries | contains(''Vacance'') }}'
                      - condition: template
                        value_template: '{{ summaries | contains(''Vacances'') }}'
                sequence:
                  - parallel:
                      - action: homeassistant.disable_entity
                        data:
                          entity_id:
                            - calendar.agenda_teletravail
                            - calendar.agenda_travail
                            - calendar.agenda_we_ferie_repos
                      - action: homeassistant.enable_entity
                        data:
                          entity_id:
                            - calendar.agenda_absent
                  - action: input_select.select_option
                    data:
                      option: Absent
                    target:
                      entity_id:
                        - input_select.chauffage_action
                        - input_select.calendrier_action
                  - if:
                      - condition: state
                        entity_id: alarm_control_panel.alarme
                        state: armed_away
                    then:
                      - action: input_select.select_option
                        data:
                          option: Absent
                        target:
                          entity_id:
                            - input_select.calendrier
                    else:
                      - action: input_select.select_option
                        data:
                          option: Repos
                        target:
                          entity_id:
                            - input_select.calendrier
              - conditions:
                  - condition: template
                    value_template: '{{ summaries | contains(''TéléTravail'') }}'
                sequence:
                  - parallel:
                      - action: homeassistant.disable_entity
                        data:
                          entity_id:
                            - calendar.agenda_absent
                            - calendar.agenda_travail
                            - calendar.agenda_we_ferie_repos
                      - action: homeassistant.enable_entity
                        data:
                          entity_id:
                            - calendar.agenda_teletravail
                  - action: input_select.select_option
                    data:
                      option: TéléTravail
                    target:
                      entity_id:
                        - input_select.calendrier
                        - input_select.chauffage_action
                        - input_select.calendrier_action
              - conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: binary_sensor.workday_sensor
                        state: 'off'
                        enabled: true
                      - condition: template
                        value_template: '{{ summaries | contains(''ARTT'') }}'
                      - condition: template
                        value_template: '{{ summaries | contains(''Congé'') }}'
                      - condition: template
                        value_template: '{{ summaries | contains(''Congés'') }}'
                    enabled: true
                sequence:
                  - parallel:
                      - action: homeassistant.disable_entity
                        data:
                          entity_id:
                            - calendar.agenda_absent
                            - calendar.agenda_teletravail
                            - calendar.agenda_travail
                      - action: homeassistant.enable_entity
                        data:
                          entity_id:
                            - calendar.agenda_we_ferie_repos
                  - action: input_select.select_option
                    data:
                      option: Repos
                    target:
                      entity_id:
                        - input_select.calendrier
                        - input_select.chauffage_action
                        - input_select.calendrier_action
            default:
              - parallel:
                  - action: homeassistant.disable_entity
                    data:
                      entity_id:
                        - calendar.agenda_absent
                        - calendar.agenda_teletravail
                        - calendar.agenda_we_ferie_repos
                  - action: homeassistant.enable_entity
                    data:
                      entity_id:
                        - calendar.agenda_travail
                note: Jour de travail par défaut → active calendar.agenda_travail, positionne mode Travail
              - action: input_select.select_option
                data:
                  option: Travail
                target:
                  entity_id:
                    - input_select.calendrier
                    - input_select.chauffage_action
                    - input_select.calendrier_action
          - action: script.turn_on
            target:
              entity_id:
                - script.notification_mail
            data:
              variables:
                message_type: Information
                message_corp: '{{ states(''input_select.calendrier'') }}'
      - note: Logique HorsGel → actif si (16 avril–14 octobre ET volets en mode Eté), ou température extérieure > 22°C, ou alarme armée absent avec calendrier Absent ; désactivé sinon
        if:
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: template
                    value_template: '{{ now().month > 4 or (now().month == 4 and now().day > 15) }}'
                  - condition: template
                    value_template: '{{ now().month < 10 or (now().month == 10 and now().day < 15) }}'
                  - condition: state
                    entity_id: input_select.volets_mode
                    state:
                      - Eté
              - condition: numeric_state
                entity_id: sensor.netatmo_exterieur_temperature
                above: 22
              - condition: and
                conditions:
                  - condition: alarm_control_panel.is_armed_away
                    target:
                      entity_id: alarm_control_panel.alarme
                    options: {}
                  - condition: select.is_option_selected
                    target:
                      entity_id: input_select.calendrier
                    options:
                      option:
                        - Absent
        then:
          - if:
              - condition: alarm_control_panel.is_armed_away
                target:
                  entity_id: alarm_control_panel.alarme
                options: {}
            then:
              - if:
                  - condition: state
                    entity_id: input_select.calendrier
                    state: Absent
                then:
                  - action: input_select.select_option
                    metadata: {}
                    data:
                      option: Vacances
                    target:
                      entity_id:
                        - input_select.domicile
                else:
                  - action: input_select.select_option
                    metadata: {}
                    data:
                      option: Absent
                    target:
                      entity_id: input_select.domicile
          - action: input_boolean.turn_on
            data: {}
            target:
              entity_id: input_boolean.chauffage_horsgel
        else:
          - action: input_boolean.turn_off
            data: {}
            target:
              entity_id: input_boolean.chauffage_horsgel
mode: restart
