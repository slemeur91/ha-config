alias: Gestion du Cycle du Lave Vaisselle
description: |-
  **Statut :** Finalisé
  **Evolution :** Aucune

  **Déclencheurs :**
  - `sensor.etat_lave_vaisselle` passe de Éteint/Veille à En marche (anti-rebond 20s) → début de cycle
  - `sensor.etat_lave_vaisselle` passe de En marche à Éteint/Veille (anti-rebond 20s) → fin de cycle
  - `sensor.prise_du_lave_vaisselle_power` repasse sous 3 W pendant 5 min (désactivé) → détection alternative de fin de cycle par consommation
  - `input_boolean.cycle_lave_vaisselle_en_cours` resté à "on" 4h → filet de sécurité (cycle trop long / fin non détectée)

  **Fonctionnement :**
  1. Début : si le cycle n'est pas déjà marqué en cours, l'active, enregistre l'index d'énergie de départ et l'horodatage de début.
  2. Fin : si le cycle est marqué en cours, enregistre l'horodatage et l'index d'énergie de fin, puis désactive le marqueur "en cours".
  3. Trop Long : désactive le marqueur "en cours" sans enregistrer de fin (filet de sécurité si la fin n'a pas été détectée dans les 4h).

  **Entités principales :**
  - `sensor.etat_lave_vaisselle` : état de l'appareil
  - `sensor.prise_du_lave_vaisselle_power` / `_energy` : puissance / énergie
  - `input_boolean.cycle_lave_vaisselle_en_cours` : marqueur de cycle en cours
  - `input_datetime.dernier_cycle_lave_vaisselle_debut` / `_fin` : horodatages du dernier cycle
  - `input_number.dernier_cycle_lave_vaisselle_conso_au_debut` / `_a_la_ffin` : index d'énergie au début/fin du dernier cycle
triggers:
  - trigger: state
    entity_id:
      - sensor.etat_lave_vaisselle
    from:
      - Éteint
      - Veille
    to:
      - En marche
    for:
      hours: 0
      minutes: 0
      seconds: 20
    id: Début
    note: Anti-rebond 20s ; démarrage détecté via l'état rapporté par l'appareil.
  - trigger: state
    entity_id:
      - sensor.etat_lave_vaisselle
    from:
      - En marche
    to:
      - Éteint
      - Veille
    for:
      hours: 0
      minutes: 0
      seconds: 20
    id: Fin
    note: Anti-rebond 20s ; fin détectée via l'état rapporté par l'appareil.
  - trigger: power.crossed_threshold
    target:
      entity_id:
        - sensor.prise_du_lave_vaisselle_power
    options:
      behavior: each
      for:
        hours: 0
        minutes: 5
        seconds: 0
      threshold:
        type: below
        value:
          active_choice: number
          number: 3
          unit_of_measurement: W
    id: Fin
    enabled: false
    note: Détection alternative de fin par chute de consommation sous le seuil — désactivée, l'état rapporté par l'appareil suffit actuellement.
  - trigger: state
    entity_id:
      - input_boolean.cycle_lave_vaisselle_en_cours
    to:
      - "on"
    for:
      hours: 4
      minutes: 0
      seconds: 0
    id: Trop Long
    note: Filet de sécurité : évite que le marqueur "en cours" reste bloqué si la fin de cycle n'est jamais détectée.
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id:
              - Début
        sequence:
          - if:
              - condition: switch.is_off
                target:
                  entity_id: input_boolean.cycle_lave_vaisselle_en_cours
                options:
                  behavior: any
                  for: "00:00:00"
            then:
              - action: input_boolean.turn_on
                metadata: {}
                target:
                  entity_id: input_boolean.cycle_lave_vaisselle_en_cours
                data: {}
              - action: input_number.set_value
                target:
                  entity_id: input_number.dernier_cycle_lave_vaisselle_conso_au_debut
                data:
                  value: "{{ states('sensor.prise_du_lave_vaisselle_energy') | float }}"
              - action: input_datetime.set_datetime
                metadata: {}
                target:
                  entity_id: input_datetime.dernier_cycle_lave_vaisselle_debut
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
            note: N'active que si pas déjà en cours (évite d'écraser l'horodatage de départ sur un redéclenchement).
        note: Début de cycle détecté
      - conditions:
          - condition: trigger
            id:
              - Fin
        sequence:
          - if:
              - condition: switch.is_on
                target:
                  entity_id: input_boolean.cycle_lave_vaisselle_en_cours
                options:
                  behavior: any
                  for: "00:00:00"
            then:
              - action: input_datetime.set_datetime
                metadata: {}
                target:
                  entity_id: input_datetime.dernier_cycle_lave_vaisselle_fin
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              - action: input_number.set_value
                target:
                  entity_id:
                    - input_number.dernier_cycle_lave_vaisselle_conso_a_la_ffin
                data:
                  value: "{{ states('sensor.prise_du_lave_vaisselle_energy') | float }}"
              - action: input_boolean.turn_off
                metadata: {}
                target:
                  entity_id: input_boolean.cycle_lave_vaisselle_en_cours
                data: {}
            note: N'enregistre la fin que si un cycle était bien marqué en cours.
        note: Fin de cycle détectée
      - conditions:
          - condition: trigger
            id:
              - Trop Long
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.cycle_lave_vaisselle_en_cours
            data: {}
        note: Réinitialisation forcée sans enregistrement de fin — la détection normale a échoué.
mode: single
