alias: Gestion du Velux - Chambre
description: '**Statut :** Finalisé

  **Evolution :** Aucune


  **Fonctionnement :**

  Automatisation basée sur le blueprint `Volets/Gestion_des_velux.yaml` : pilote le
  velux selon la présence, le soleil, les alertes météo, la température intérieure/extérieure
  (ouverture pour aération l''été ou chauffage passif l''hiver, fermeture pour protection
  thermique), la pluie, et une dérogation de 15mn en cas d''ouverture manuelle (avec
  anti-rebond 45s sur la détection de mouvement).


  **Entités principales :**

  - `cover.velux_de_la_chambre` : velux piloté

  - `climate.chauffage_de_la_chambre_nodeid_6_climate` : chauffage de la pièce

  - `sensor.netatmo_chambre_temperature` : température intérieure secondaire

  - `input_select.presence_chambre` : présence

  - `binary_sensor.velux_de_la_chambre_pluie` : capteur de pluie

  - `input_button.velux_chambre_fermer` : réactivation manuelle

  - `timer.velux_chambre_timer` : timer de dérogation'
use_blueprint:
  path: Volets/Gestion_des_velux.yaml
  input:
    velux_name: Chambre
    velux_target: cover.velux_de_la_chambre
    temp_secondaire: sensor.netatmo_chambre_temperature
    presence_entite: input_select.presence_chambre
    velux_button: input_button.velux_chambre_fermer
    chauffage_target: climate.chauffage_de_la_chambre_nodeid_6_climate
    velux_timer: timer.velux_chambre_timer
    pluie_target: binary_sensor.velux_de_la_chambre_pluie
