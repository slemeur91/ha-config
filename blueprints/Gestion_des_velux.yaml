blueprint:
  name: "Gestion du Velux - "
  description: |
    **Contrôle intelligent d'un Velux selon la présence, le soleil, les alertes météo et la température.**

    **Entités requises (doivent exister avant utilisation) :**
    - `input_select.domicile` → Occupation du domicile (Présent/Nuit/Vacances/Absent).
    - `input_select.volets_mode` → Mode chaud/froid (Été/Hiver).
    - `sensor.91_weather_alert` → Alerte météo.
    - `sensor.netatmo_exterieur_temperature` → Température extérieure.
    - `input_button.volets_reactivation` → Réactivation manuelle globale.

    **Fonctionnalités intégrées :**
    1. **Fermeture conditionnelle** (absence, nuit en hiver, alerte météo, protection thermique).
    2. **Dérogation 1h** (si le velux est ouvert manuellement, les fermetures automatiques sont bloquées pendant 1h).
    3. **Réactivation manuelle** (bouton de fermeture forcée, réinitialise la dérogation).

    **Helpers à créer par instance :**
    - `input_boolean.velux_<nom>_derogation` (généré automatiquement depuis le nom)
    - Un `timer` dédié (ex: `timer.velux_<nom>_timer`, durée 1h)

  domain: automation
  input:
    velux_name:
      name: Nom du Velux
      description: "Entrez le nom (ex: suite_parentale). Utilisé pour générer les entités."
      selector:
        text:
    # Entités cibles
    velux_target:
      name: Velux
      description: Le velux à piloter.
      selector:
        entity:
          domain: cover
    chauffage_target:
      name: Chauffage
      description: Le chauffage de la pièce.
      selector:
        entity:
          domain: climate
    # Entité bouton
    velux_button:
      name: Nom du bouton
      description: Le bouton pour fermer le velux.
      selector:
        entity:
          domain: input_button
    # Timer de dérogation
    velux_timer:
      name: Nom du velux_timer
      description: "Le timer de dérogation du velux (configurer à 1h00)."
      selector:
        entity:
          domain: timer
    # Températures
    temp_secondaire:
      name: "Température Intérieure Secondaire (optionnel)"
      description: "Optionnel : seconde sonde de température."
      default: []
      selector:
        entity:
          domain: sensor
    # Champ rendu optionnel
    presence_entite:
      name: "Entité présence (optionnel)"
      description: "Entité pour détecter la présence (ex: `input_select.presence_chambre`)."
      default: []
      selector:
        entity:
          domain: input_select

# Section Variables pour composer et figer les données techniques
variables:
  velux_name_var: !input velux_name
  velux_target_var: !input velux_target
  chauffage_target_var: !input chauffage_target
  presence_entite_var: !input presence_entite
  temp_secondaire_var: !input temp_secondaire
  weather_alert: "sensor.91_weather_alert"
  velux_derogation: "input_boolean.velux_{{ velux_name_var | slugify }}_derogation"

mode: queued
max: 10

# --- Triggers ---
trigger:
  # Déclencheurs principaux
  - platform: state
    entity_id:
      - input_select.domicile
      - input_select.volets_mode
      - sensor.91_weather_alert

  - platform: state
    entity_id:
      - sensor.sun_next_dawn
      - sensor.sun_next_dusk
    id: "Aube/Crépuscule"

  # Bouton de fermeture manuelle
  - platform: state
    entity_id: !input velux_button
    id: "Fermer"

  - platform: state
    entity_id: input_button.volets_reactivation
    id: "Réactivation"

  # Triggers température — la logique de comparaison est dans l'action
  - platform: state
    entity_id: sensor.netatmo_exterieur_temperature
    id: "Température"

  - platform: state
    entity_id: !input chauffage_target
    attribute: current_temperature
    id: "Température"

  - platform: state
    entity_id: !input temp_secondaire
    id: "Température"

  # Dérogation — détection d'ouverture manuelle du velux
  - platform: state
    entity_id: !input velux_target
    attribute: current_position
    for: "00:01:00"
    id: "velux_mouvement"

  - platform: event
    event_type: timer.finished
    event_data:
      entity_id: !input velux_timer
    id: "velux_timer_finished"

action:
#  - service: system_log.write
#    data:
#      message: "Blueprint Velux : {{ trigger.id }} / {{ velux_name_var }}"
#      level: warning
  - choose:
      # --- 1. Timer de dérogation terminé → désactive la dérogation ---
      - conditions:
          - condition: trigger
            id: "velux_timer_finished"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ velux_derogation }}"

      # --- 2. Mouvement du velux → dérogation 1h si ouvert, reset si fermé ---
      - conditions:
          - condition: trigger
            id: "velux_mouvement"
        sequence:
          - if:
              - condition: template
                value_template: "{{ state_attr(velux_target_var, 'current_position') | int(0) > 5 }}"
            then:
              - action: input_boolean.turn_on
                target:
                  entity_id: "{{ velux_derogation }}"
              - action: timer.start
                data:
                  duration: "01:00:00"
                target:
                  entity_id: !input velux_timer
            else:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ velux_derogation }}"
              - action: timer.cancel
                target:
                  entity_id: !input velux_timer

      # --- 3. Fermeture manuelle ou réactivation → reset dérogation + ferme si absent ---
      - conditions:
          - condition: trigger
            id:
              - "Fermer"
              - "Réactivation"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: "{{ velux_derogation }}"
          - action: timer.cancel
            target:
              entity_id: !input velux_timer
          - if:
              - condition: and
                conditions:
                  - condition: template
                    value_template: "{{ presence_entite_var == [] or is_state(presence_entite_var, 'Absent') }}"
                  - condition: template
                    value_template: "{{ not is_state(velux_target_var, 'closed') }}"
            then:
              - action: cover.close_cover
                target:
                  entity_id: !input velux_target

      # --- 4. Alerte Rouge (grêle ou vent violent) ---
      - conditions:
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ is_state(velux_derogation, 'off') }}"
              - condition: state
                entity_id: sensor.91_weather_alert
                state: Rouge
              - condition: template
                value_template: "{{ (is_state(weather_alert, 'Rouge') and states('sensor.cheptainville_original_condition') in ['Orage avec grêle', 'Risque de grêle', 'Averses de grêle']) or state_attr(weather_alert, 'Vent violent') in ['Rouge'] }}"
        sequence:
          - action: input_button.press
            target:
              entity_id: !input velux_button

      # --- 5. Vacances / Absent ---
      - conditions:
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ is_state(velux_derogation, 'off') }}"
              - condition: template
                value_template: "{{ states('input_select.domicile') in ['Vacances', 'Absent'] }}"
        sequence:
          - action: input_button.press
            target:
              entity_id: !input velux_button

      # --- 6. Nuit en mode Hiver (Logique Soleil) ---
      - conditions:
          - condition: trigger
            id: "Aube/Crépuscule"
          - condition: and
            conditions:
              - condition: template
                value_template: "{{ is_state(velux_derogation, 'off') }}"
              - condition: template
                value_template: "{{ is_state('input_select.volets_mode', 'Hiver') }}"
              - condition: or
                conditions:
                  - condition: template
                    value_template: >-
                      {{ as_timestamp(states('sensor.sun_next_midnight')) >
                      as_timestamp(states('sensor.sun_next_dawn')) }}
                  - condition: template
                    value_template: >-
                      {{ as_timestamp(states('sensor.sun_next_midnight')) <
                      as_timestamp(states('sensor.sun_next_dusk')) }}
        sequence:
          - action: input_button.press
            target:
              entity_id: !input velux_button

      # --- 7. Protection Thermique ---
      - conditions:
          - condition: trigger
            id: "Température"
          - condition: template
            value_template: "{{ is_state(velux_derogation, 'off') }}"
          - condition: template
            value_template: >-
              {% set ext = states('sensor.netatmo_exterieur_temperature') | float(0) %}
              {% set int1 = state_attr(chauffage_target_var, 'current_temperature') | float(0) %}
              {% set int2 = states(temp_secondaire_var) | float(0) if temp_secondaire_var not in [none, '', []] else none %}
              {{ ext > int1
                 or (int2 is not none and ext > int2)
                 or int1 < 19.5
                 or (int2 is not none and int2 < 19.5) }}
        sequence:
          - action: input_button.press
            target:
              entity_id: !input velux_button

    default: []
